name: Delete Merged Branch

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write
  pull-requests: read

jobs:
  delete-merged-branch:
    name: Delete merged feature branch
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Delete merged branch
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const base = context.payload.pull_request.base.ref;

            // Never delete protected/integration branches
            const protectedBranches = ['main', 'develop'];

            if (protectedBranches.includes(branch)) {
              core.info(`Skipping protected branch: ${branch}`);
              return;
            }

            core.info(`Deleting merged branch: ${branch}`);

            await github.rest.git.deleteRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${branch}`
            });

            core.info(`Successfully deleted remote branch: ${branch}`);